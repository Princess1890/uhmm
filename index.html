<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="background">
        <div class="heart">♡</div>
        <div class="heart">♥</div>
        <div class="heart">♡</div>
        <div class="heart">♥</div>
        <div class="heart">♡</div>
    </div>


    <!-- Envelope Screen -->
    <div class="scene" id="scene">

        <div class="small-text">
            A little something for you
        </div>

        <div class="envelope-wrapper" id="envelope">

            <div class="envelope">

                <!-- Letter -->
                <div class="letter">
                    <span>For you ♡</span>
                </div>

                <!-- Envelope flap -->
                <div class="flap"></div>

                <!-- Heart seal -->
                <div class="seal">
                    ♥
                </div>

            </div>

        </div>

        <div class="click-text">
            tap the envelope ♡
        </div>

    </div>


    <!-- Boyfriend's Day Greeting -->
    <!-- HAPPY BOYFRIEND'S DAY SCREEN -->

<div class="greeting" id="greeting">

    <!-- Decorative stickers -->
    <img src="bubu.gif"
         class="sticker sticker-kiss"
         alt="cute couple">

    <img src="heart.gif"
         class="sticker sticker-heart"
         alt="cute heart">

    <img src="Bubu3.gif"
         class="sticker sticker-cuddle"
         alt="cute couple">

    <img src="cute.gif"
         class="sticker sticker-flower"
         alt="cute couple">


    <!-- Main text -->

    <div class="greeting-content">

        <div class="tiny">
            FOR YOU ✨
        </div>

        <h1>
            Happy Boyfriend's Day
        </h1>

        <h2>
            Babyyy🤍
        </h2>

        <div class="message">
            I made a little something for you...
        </div>

        <a href="mine.html" class="continue-btn">
    Continue ♡
</a>
    </div>

</div>


    <script src="script.js"></script>

</body>
</html>
