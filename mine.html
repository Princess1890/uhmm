<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Little Question 🤍</title>

    <link rel="stylesheet" href="mine.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="background">
        <div class="heart">♡</div>
        <div class="heart">♥</div>
        <div class="heart">♡</div>
        <div class="heart">♥</div>
        <div class="heart">♡</div>
        <div class="heart">♥</div>
    </div>

    <!-- Main Page -->
    <main class="mine-page">

        <!-- Bubu Dudu GIF -->
        <div class="sticker">
            <img src="bubu-happy.gif" alt="Cute couple">
        </div>

        <p class="small-text">
            Okay... one very important question 👀
        </p>

        <h1>
            Will you be mine? 🥺🤍
        </h1>

        <div class="buttons">

            <button class="yes-btn" id="yesBtn">
                YES ♡
            </button>

            <button class="no-btn" id="noBtn">
                NO 🙈
            </button>

        </div>

        <p class="message" id="message"></p>

        <!-- Appears after YES -->
        <button class="continue-btn" id="continueBtn">
            Continue ♡
        </button>

    </main>

    <script src="mine.js"></script>

</body>
</html>
